<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reviews | FoodDelivery</title>
    <meta name="theme-color" content="#ce4b14" />
    <link rel="icon" href="/images/favicon.svg" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/reviews.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
    <div class="wrap">
        <div class="page-head">
            <p class="eyebrow">GOOD FOOD. HONEST WORDS.</p>
            <h1>How was your meal?</h1>
            <p>
                Share a little love or tell us what could be better. Reviews are
                linked to delivered orders.
            </p>
        </div>
        <div class="reviews-layout">
            <section class="panel review-form-panel" id="review-form-panel">
                <p class="loading">Getting your orders…</p>
            </section>
            <section>
                <div id="reviews-summary"></div>
                <div id="review-list"><p class="loading">Loading reviews…</p></div>
            </section>
        </div>
    </div>
</main>
<div id="site-footer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript
><p class="notice">
    Please enable JavaScript to use the menu, account and ordering features.
</p></noscript
>
<script type="module" src="/js/reviews.js"></script>
</body>
</html>
