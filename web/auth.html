<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your account | Foodi</title>
    <meta name="theme-color" content="#ce4b14" />
    <link rel="icon" href="/images/favicon.svg" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/customers.css" />
    <link rel="stylesheet" href="/css/home.css" />
  </head>
  <body>
    <!-- Shared site header is filled in by the website scripts. -->
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>
    <main id="main">
      <!-- JavaScript fills this area with the login or registration form. -->
      <div class="wrap auth-layout">
        <section class="auth-story">
          <p class="eyebrow">COME FOR THE FOOD. STAY FOR THE FEELING.</p>
          <h1>A little comfort.<br /><em>Delivered.</em></h1>
          <p>
            Your local favourites, one simple account. Save your details and
            follow every order.
          </p>
          <img
            src="/images/delivery-rider.png"
            alt="Orange food delivery scooter"
          />
        </section>
        <section class="panel auth-box" id="auth-box">
          <p class="loading">Getting things ready…</p>
        </section>
      </div>
    </main>
    <div id="site-footer"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <!-- Show this message if JavaScript is turned off. -->
    <noscript
      ><p class="notice">
        Please enable JavaScript to use the menu, account and ordering features.
      </p></noscript
    >
    <!-- Load customer account form and event handling. -->
    <script type="module" src="/js/customers.js"></script>
  </body>
</html>
